name: "MNLTH / qa-aws-ecs / Run"

on:
  workflow_dispatch:
    inputs:
      use_latest:
        type: boolean
        default: true
        description: "Use :latest version, last main"
      update_web_only:
        type: boolean
        default: false
        description: "Update 'web-service' only"

concurrency:
  group: monolith-qa-aws-ecs-runtime
  cancel-in-progress: false

jobs:

  get_image_tag:
    name: Resolve image tag
    runs-on: ubuntu-latest
    outputs:
      IMAGE_TAG: ${{ steps.resolve-image-tag.outputs.IMAGE_TAG }}

    steps:
      - name: 🛠️ Checkout code
        uses: actions/checkout@v6

      - name: 🎖️ Resolve image tag
        id: resolve-image-tag
        run: |
          if [ "${{ github.event.inputs.use_latest }}" = "true" ]; then
            IMAGE_TAG="latest"
          else
            IMAGE_TAG=$(git rev-parse --short ${{ github.event.pull_request.head.sha || github.sha }})
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT

  run_mssql:
    if: ${{ github.event.inputs.update_web_only == 'false' }}
    name: Run mssql-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ vars.MONOLITH_SLN_PATH }}/iac/envs/qa-aws-ecs

    steps:
      - name: 🛠️ Checkout code
        uses: actions/checkout@v6

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: 📝 Render task definition
        id: render-mssql
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: contoso-mnlth-mssql-tasks
          container-name: mssql
          image: mcr.microsoft.com/mssql/server

      - name: 🚀 Kick off MsSql Server
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-mssql.outputs.task-definition }}
          service: contoso-mnlth-mssql-service
          cluster: contoso-mnlth-cluster
          desired-count: 1
          wait-for-service-stability: true

  run_mssql_migrator:
    if: ${{ github.event.inputs.update_web_only == 'false' }}
    name: Run mssql-migrator task
    needs: [run_mssql, get_image_tag]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ vars.MONOLITH_SLN_PATH }}/iac/envs/qa-aws-ecs

    steps:
      - name: 🛠️ Checkout code
        uses: actions/checkout@v6

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: 📝 Render task definition
        id: render-mssql-migrator
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: contoso-mnlth-mssql-migrator-tasks
          container-name: mssql-migrator
          image: ghcr.io/alexbohomol/mssql-migrator:${{ needs.get_image_tag.outputs.IMAGE_TAG }}

      - name: 🚀 Kick off database migration
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-mssql-migrator.outputs.task-definition }}
          cluster: contoso-mnlth-cluster
          run-task: true
          run-task-subnets: ${{ vars.AWS_SUBNET_IDS }}
          run-task-security-groups: ${{ vars.AWS_SG_ID }}
          run-task-assign-public-IP: ENABLED
          wait-for-task-stopped: true

  run_web:
    if: ${{ always() && needs.get_image_tag.result == 'success' && (inputs.update_web_only || needs.run_mssql_migrator.result == 'success') }}
    name: Run web-service
    needs: [run_mssql_migrator, get_image_tag]
    environment:
      name: qa-aws-ecs
      url: https://qa-aws-ecs.mnlth.university.contoso.name
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ vars.MONOLITH_SLN_PATH }}/iac/envs/qa-aws-ecs

    steps:
      - name: 🛠️ Checkout code
        uses: actions/checkout@v6

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Prepare web autoscaling
        id: web-scaling
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_ID="service/contoso-mnlth-cluster/contoso-mnlth-web-service"
          TARGET=$(aws application-autoscaling describe-scalable-targets \
            --service-namespace ecs --scalable-dimension ecs:service:DesiredCount \
            --resource-ids "$RESOURCE_ID" --query 'ScalableTargets[0]' --output json)
          MIN=$(jq -er '.MinCapacity' <<< "$TARGET")
          MAX=$(jq -er '.MaxCapacity' <<< "$TARGET")
          aws application-autoscaling register-scalable-target \
            --service-namespace ecs --scalable-dimension ecs:service:DesiredCount \
            --resource-id "$RESOURCE_ID" \
            --suspended-state DynamicScalingInSuspended=true,DynamicScalingOutSuspended=true,ScheduledScalingSuspended=true
          CURRENT=$(aws ecs describe-services --cluster contoso-mnlth-cluster \
            --services contoso-mnlth-web-service --query 'services[0].desiredCount' --output text)
          DESIRED=$(jq -n --argjson current "$CURRENT" --argjson min "$MIN" --argjson max "$MAX" \
            '[$current, $min] | max | [., $max] | min')
          echo "desired_count=$DESIRED" >> "$GITHUB_OUTPUT"

      - name: 📝 Render task definition
        id: render-web
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: contoso-mnlth-web-tasks
          container-name: web
          image: ghcr.io/alexbohomol/web-monolith:${{ needs.get_image_tag.outputs.IMAGE_TAG }}

      - name: 🚀 Kick off application instances
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-web.outputs.task-definition }}
          service: contoso-mnlth-web-service
          cluster: contoso-mnlth-cluster
          desired-count: ${{ steps.web-scaling.outputs.desired_count }}
          wait-for-service-stability: true

      - name: Resume web autoscaling
        shell: bash
        run: |
          aws application-autoscaling register-scalable-target \
            --service-namespace ecs --scalable-dimension ecs:service:DesiredCount \
            --resource-id service/contoso-mnlth-cluster/contoso-mnlth-web-service \
            --suspended-state DynamicScalingInSuspended=false,DynamicScalingOutSuspended=false,ScheduledScalingSuspended=false
